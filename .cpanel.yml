---
deployment:
  tasks:
    # 1. Sync the frontend build to the root of the repository deployment path
    - /bin/cp -R frontend/dist/* ./
    
    # 2. Copy the cPanel routing template to the active .htaccess
    - /bin/cp .htaccess_cpanel_template .htaccess

    # 3. Touch tmp/restart.txt to automatically restart Phusion Passenger application
    - /bin/mkdir -p tmp
    - /bin/touch tmp/restart.txt
